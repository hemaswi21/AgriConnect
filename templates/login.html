<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect - రైతు స్వాగతం (Farmer Login)</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, rgba(22, 101, 52, 0.85), rgba(21, 128, 61, 0.75)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            max-width: 460px;
            width: 100%;
            padding: 2.2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            border: 2px solid #86efac;
            text-align: center;
        }
        .login-logo {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }
        .login-title {
            color: #166534;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }
        .login-sub {
            color: #475569;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        .login-form {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .login-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.3);
        }
        .login-btn:hover {
            background: #15803d;
            transform: translateY(-2px);
        }
        .easy-btn {
            background: #fef08a;
            color: #854d0e;
            border: 2px solid #facc15;
            padding: 0.8rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .easy-btn:hover {
            background: #fde047;
            transform: translateY(-2px);
        }
        .lang-switch {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">Switch to English</button>
    </div>

    <div class="login-card">
        <div class="login-logo">🌾</div>
        <h1 class="login-title" id="loginHeader" data-i18n="login_title">రైతు స్వాగతం</h1>
        <p class="login-sub" id="loginDesc" data-i18n="login_sub">AgriConnect లోకి ప్రవేశించడానికి మీ వివరాలను తెలపండి</p>

        <form class="login-form" onsubmit="handleFarmerLogin(event)">
            <div class="form-group">
                <label for="farmerName" id="lblFarmerName" data-i18n="login_name_label" style="font-weight: 600; color: #1e293b;">
                    👤 రైతు పేరు:
                </label>
                <input type="text" id="farmerName" class="form-control" data-i18n-placeholder="login_name_placeholder" placeholder="ఉదా: రామయ్య" required>
            </div>

            <div class="form-group">
                <label for="farmerMobile" id="lblFarmerMobile" data-i18n="login_mobile_label" style="font-weight: 600; color: #1e293b;">
                    📱 మొబైల్ నంబర్:
                </label>
                <input type="tel" id="farmerMobile" class="form-control" data-i18n-placeholder="login_mobile_placeholder" placeholder="10 అంకెల నంబర్ (ఉదా: 9876543210)" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label for="farmerVillage" id="lblFarmerVillage" data-i18n="login_village_label" style="font-weight: 600; color: #1e293b;">
                    📍 గ్రామం / జిల్లా:
                </label>
                <input type="text" id="farmerVillage" class="form-control" data-i18n-placeholder="login_village_placeholder" placeholder="ఉదా: వరంగల్" required>
            </div>

            <button type="submit" class="login-btn" id="btnLogin" data-i18n="login_btn_submit">
                🌾 ప్రవేశించండి
            </button>
        </form>

        <div style="margin: 1.2rem 0; display: flex; align-items: center; gap: 8px;">
            <div style="flex: 1; height: 1px; background: #cbd5e1;"></div>
            <span style="font-size: 0.85rem; color: #64748b; font-weight: 600;" data-i18n="login_or">లేదా</span>
            <div style="flex: 1; height: 1px; background: #cbd5e1;"></div>
        </div>

        <!-- 1-Click Quick Access (No typing needed) -->
        <button type="button" class="easy-btn" onclick="handleGrandfatherLogin()" data-i18n="login_grandfather_btn">
            ⚡ సులభ ప్రవేశం (1-క్లిక్ డైరెక్ట్ ఎంట్రీ)
        </button>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem("agri_farmer")) {
            window.location.href = "/";
        }

        function handleFarmerLogin(e) {
            e.preventDefault();
            const name = document.getElementById("farmerName").value.trim();
            const mobile = document.getElementById("farmerMobile").value.trim();
            const village = document.getElementById("farmerVillage").value.trim();

            if (name && mobile) {
                const farmer = { name: name, mobile: mobile, village: village || "వరంగల్" };
                localStorage.setItem("agri_farmer", JSON.stringify(farmer));
                window.location.href = "/";
            }
        }

        function handleGrandfatherLogin() {
            // Direct 1-click quick access
            const isTe = currentLang === 'te';
            const farmerName = isTe ? "రైతు మిత్రుడు" : "Farmer Friend";
            const villageName = isTe ? "వరంగల్" : "Warangal";
            const farmer = { name: farmerName, mobile: "9876543210", village: villageName };
            localStorage.setItem("agri_farmer", JSON.stringify(farmer));
            window.location.href = "/";
        }
    </script>
</body>
</html>
