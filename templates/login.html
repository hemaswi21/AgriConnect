<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect - రైతు స్వాగతం (Farmer Login)</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, rgba(22, 101, 52, 0.85), rgba(21, 128, 61, 0.75)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            max-width: 460px;
            width: 100%;
            padding: 2.2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            border: 2px solid #86efac;
            text-align: center;
        }
        .login-logo {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }
        .login-title {
            color: #166534;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }
        .login-sub {
            color: #475569;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        .login-form {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .login-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.3);
        }
        .login-btn:hover {
            background: #15803d;
            transform: translateY(-2px);
        }
        .easy-btn {
            background: #fef08a;
            color: #854d0e;
            border: 2px solid #facc15;
            padding: 0.8rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .easy-btn:hover {
            background: #fde047;
            transform: translateY(-2px);
        }
        .lang-switch {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">Switch to English</button>
    </div>

    <div class="login-card">
        <div class="login-logo">🌾</div>
        <h1 class="login-title" id="loginHeader">రైతు స్వాగతం</h1>
        <p class="login-sub" id="loginDesc">AgriConnect లోకి ప్రవేశించడానికి మీ వివరాలను తెలపండి</p>

        <form class="login-form" onsubmit="handleFarmerLogin(event)">
            <div class="form-group">
                <label for="farmerName" id="lblFarmerName" style="font-weight: 600; color: #1e293b;">
                    👤 రైతు పేరు (Farmer Name):
                </label>
                <input type="text" id="farmerName" class="form-control" placeholder="ఉదా: రామయ్య (Ramaiah)" required>
            </div>

            <div class="form-group">
                <label for="farmerMobile" id="lblFarmerMobile" style="font-weight: 600; color: #1e293b;">
                    📱 మొబైల్ నంబర్ (Mobile Number):
                </label>
                <input type="tel" id="farmerMobile" class="form-control" placeholder="ఉదా: 9876543210" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label for="farmerVillage" id="lblFarmerVillage" style="font-weight: 600; color: #1e293b;">
                    📍 గ్రామం / జిల్లా (Village / District):
                </label>
                <input type="text" id="farmerVillage" class="form-control" placeholder="ఉదా: వరంగల్ (Warangal)" required>
            </div>

            <button type="submit" class="login-btn" id="btnLogin">
                🌾 ప్రవేశించండి (Login to AgriConnect)
            </button>
        </form>

        <div style="margin: 1.2rem 0; display: flex; align-items: center; gap: 8px;">
            <div style="flex: 1; height: 1px; background: #cbd5e1;"></div>
            <span style="font-size: 0.85rem; color: #64748b; font-weight: 600;">లేదా (OR)</span>
            <div style="flex: 1; height: 1px; background: #cbd5e1;"></div>
        </div>

        <!-- 1-Click Easy Access for Grandfather -->
        <button type="button" class="easy-btn" onclick="handleGrandfatherLogin()">
            ⚡ తాతయ్య గారి సులభ ప్రవేశం (1-Click Easy Login)
        </button>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem("agri_farmer")) {
            window.location.href = "/";
        }

        function handleFarmerLogin(e) {
            e.preventDefault();
            const name = document.getElementById("farmerName").value.trim();
            const mobile = document.getElementById("farmerMobile").value.trim();
            const village = document.getElementById("farmerVillage").value.trim();

            if (name && mobile) {
                const farmer = { name: name, mobile: mobile, village: village || "వరంగల్" };
                localStorage.setItem("agri_farmer", JSON.stringify(farmer));
                window.location.href = "/";
            }
        }

        function handleGrandfatherLogin() {
            // Direct 1-click access for grandfather
            const farmer = { name: "తాతయ్య (Grandfather)", mobile: "9876543210", village: "స్వంత గ్రామం" };
            localStorage.setItem("agri_farmer", JSON.stringify(farmer));
            window.location.href = "/";
        }

        // Apply translations on load
        function updateLoginLang() {
            const isTe = currentLang === 'te';
            document.getElementById("loginHeader").textContent = isTe ? "రైతు స్వాగతం" : "Farmer Welcome & Login";
            document.getElementById("loginDesc").textContent = isTe ? "AgriConnect లోకి ప్రవేశించడానికి మీ వివరాలను తెలపండి" : "Enter your simple details to access AgriConnect";
            document.getElementById("lblFarmerName").textContent = isTe ? "👤 రైతు పేరు (Farmer Name):" : "👤 Farmer Name:";
            document.getElementById("lblFarmerMobile").textContent = isTe ? "📱 మొబైల్ నంబర్ (Mobile Number):" : "📱 Mobile Number:";
            document.getElementById("lblFarmerVillage").textContent = isTe ? "📍 గ్రామం / జిల్లా (Village / District):" : "📍 Village / District:";
            document.getElementById("btnLogin").textContent = isTe ? "🌾 ప్రవేశించండి (Login to AgriConnect)" : "🌾 Enter AgriConnect";
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateLoginLang();
        });
    </script>
</body>
</html>
